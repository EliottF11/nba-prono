<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NBA PRONO - Ligue de Pronostics</title>
  
  <!-- Configuration PWA (Progressive Web App) -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#ff5500">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NBA Prono">
  <link rel="apple-touch-icon" href="/static/icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Feuille de style dédiée -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="court-bg min-h-screen pb-20 text-slate-100">

  <!-- Wrapper Mobile-First -->
  <div class="max-w-md mx-auto min-h-screen flex flex-col border-x border-[#171922] bg-[#0c0d12] shadow-2xl relative">
    
    <!-- Top Bar Sportive -->
    <header class="sticky top-0 z-30 bg-[#0c0d12]/95 backdrop-blur-md border-b border-[#1b1e28] px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <!-- Logo minimaliste basket -->
        <img src="/static/icons/icon.svg" alt="NBA Prono" class="w-8 h-8 rounded-lg shadow-md shadow-[#ff5500]/25">
        <div>
          <div class="font-condensed font-black text-xl tracking-tight leading-none text-white flex items-center gap-1.5">
            <span>NBA</span>
            <span class="text-[#ff5500]">PRONO</span>
          </div>
          <div class="text-[10px] text-slate-400 font-semibold tracking-wider uppercase">Saison 2026/2027</div>
        </div>
      </div>

      <!-- Actions & Section Utilisateur -->
      <div class="flex items-center space-x-2">
        
        <!-- Bouton Partager / Défier -->
        <button onclick="shareApp()" title="Inviter des amis" class="flex items-center space-x-1 bg-[#171a24] hover:bg-[#202534] border border-[#272d3e] text-slate-300 px-2.5 py-1 rounded-lg text-xs font-bold transition cursor-pointer">
          <svg class="w-3.5 h-3.5 text-[#ff5500]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
          </svg>
          <span class="text-[11px]">Défier</span>
        </button>

        <div id="user-score-badge" class="hidden flex items-center space-x-1.5 bg-[#171a24] border border-[#252a3a] px-2.5 py-1 rounded-lg">
          <span class="text-[10px] text-slate-400 font-bold uppercase">Pts</span>
          <span id="user-points-val" class="font-condensed text-base font-black text-[#ff5500]">0.0</span>
        </div>
        
        <div id="auth-btn-container">
          <!-- Injecté par app.js -->
        </div>
      </div>
    </header>

    <!-- Zone principale -->
    <main class="flex-1 p-3.5 space-y-3.5">

      <!-- BANNER : Règles succinctes & status -->
      <div class="bg-gradient-to-r from-[#171a24] to-[#12141c] border border-[#232738] rounded-xl p-3 flex items-center justify-between">
        <div class="space-y-0.5">
          <div class="text-xs font-bold text-white flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-[#ff5500]"></span>
            <span>Règle des cotes</span>
          </div>
          <p class="text-[11px] text-slate-400">
            Trouve le vainqueur • Empoche la cote exacte en points
          </p>
        </div>
        <div class="text-right">
          <span id="open-matches-count" class="font-condensed text-xs font-bold px-2 py-0.5 rounded bg-[#202535] text-slate-300 border border-[#2e344a]">
            16 MATCHS
          </span>
        </div>
      </div>

      <!-- VUE 1 : PRONOSTICS -->
      <section id="matches-view" class="space-y-3">
        
        <!-- Filtres par statut -->
        <div class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs scrollbar-none">
          <button class="filter-chip active px-3 py-1 rounded-full font-bold bg-[#ff5500] text-black transition cursor-pointer" data-filter="all">
            Tous les matchs
          </button>
          <button class="filter-chip px-3 py-1 rounded-full font-semibold bg-[#171a24] text-slate-300 hover:text-white border border-[#232738] transition cursor-pointer" data-filter="upcoming">
            Ouverts
          </button>
          <button class="filter-chip px-3 py-1 rounded-full font-semibold bg-[#171a24] text-slate-300 hover:text-white border border-[#232738] transition cursor-pointer" data-filter="finished">
            Terminés
          </button>
        </div>

        <!-- Liste des cartes de match -->
        <div id="matches-list" class="space-y-3">
          <!-- Injecté dynamiquement -->
        </div>

      </section>

      <!-- VUE 2 : CLASSEMENT GÉNÉRAL -->
      <section id="leaderboard-view" class="hidden space-y-4">
        
        <div class="flex items-center justify-between">
          <div>
            <h2 class="font-condensed text-xl font-black uppercase text-white tracking-wide">Classement Général</h2>
            <p class="text-[11px] text-slate-400">Actualisé en temps réel après chaque rencontre</p>
          </div>
          <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
            Live
          </span>
        </div>

        <!-- Podium Top 3 -->
        <div id="leaderboard-podium" class="grid grid-cols-3 gap-2 items-end pt-2 pb-1">
          <!-- Injecté dynamiquement -->
        </div>

        <!-- Tableau complet -->
        <div class="bg-[#12141a] border border-[#1f222d] rounded-xl overflow-hidden shadow-lg">
          <div class="grid grid-cols-12 px-3.5 py-2 bg-[#171922] border-b border-[#212432] text-[10px] font-black uppercase tracking-wider text-slate-400">
            <div class="col-span-2 text-center">Rang</div>
            <div class="col-span-6">Joueur</div>
            <div class="col-span-2 text-center">Pronos</div>
            <div class="col-span-2 text-right">Pts</div>
          </div>
          <div id="leaderboard-table-rows" class="divide-y divide-[#1b1e28]">
            <!-- Injecté dynamiquement -->
          </div>
        </div>

      </section>

    </main>

    <!-- Bottom Navigation Bar Native -->
    <nav class="native-tabbar fixed bottom-0 left-0 right-0 max-w-md mx-auto z-40 px-6 py-2 flex items-center justify-around">
      
      <!-- Onglet Matchs -->
      <button data-tab="matches" class="tab-btn active flex flex-col items-center py-1 transition cursor-pointer text-[#ff5500]">
        <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 3v18M3 12h18M5.5 5.5l13 13M5.5 18.5l13-13"/>
        </svg>
        <span class="font-condensed text-xs font-black uppercase tracking-wider">Pronostics</span>
      </button>

      <!-- Onglet Classement -->
      <button data-tab="leaderboard" class="tab-btn flex flex-col items-center py-1 transition cursor-pointer text-slate-400 hover:text-slate-200">
        <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M6 9H4.5a2.5 2.5 0 010-5H6M18 9h1.5a2.5 2.5 0 000-5H18M4 22h16M10 14.66V17c0 .55-.45 1-1 1H7.5c-.55 0-1-.45-1-1v-2.34M14 14.66V17c0 .55.45 1 1 1h1.5c.55 0 1-.45 1-1v-2.34M6 4h12v7a6 6 0 01-12 0V4z"/>
        </svg>
        <span class="font-condensed text-xs font-black uppercase tracking-wider">Classement</span>
      </button>

    </nav>

    <!-- Modale Connexion / Inscription -->
    <div id="auth-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4 hidden">
      <div class="bg-[#12141a] border border-[#25293a] rounded-2xl w-full max-w-sm p-5 shadow-2xl relative">
        
        <button id="close-auth-modal" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg p-1 focus:outline-none cursor-pointer">
          ✕
        </button>

        <div class="mb-4">
          <div class="font-condensed text-2xl font-black uppercase tracking-tight text-white" id="auth-title">
            Connexion
          </div>
          <p class="text-xs text-slate-400" id="auth-subtitle">
            Accède à ta ligue et enregistre tes pronostics.
          </p>
        </div>

        <div id="auth-error-box" class="hidden mb-3.5 p-2.5 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-semibold">
        </div>

        <form id="auth-form" class="space-y-3">
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Pseudo de joueur</label>
            <input 
              type="text" 
              id="auth-username-input" 
              required 
              minlength="3" 
              placeholder="Ex: Anteto34" 
              class="w-full bg-[#181a24] border border-[#282c3e] rounded-xl px-3.5 py-2.5 text-sm text-white placeholder:text-slate-600 focus:outline-none focus:border-[#ff5500]"
            >
          </div>

          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Mot de passe</label>
            <input 
              type="password" 
              id="auth-password-input" 
              required 
              minlength="4" 
              placeholder="••••••••" 
              class="w-full bg-[#181a24] border border-[#282c3e] rounded-xl px-3.5 py-2.5 text-sm text-white placeholder:text-slate-600 focus:outline-none focus:border-[#ff5500]"
            >
          </div>

          <button 
            type="submit" 
            id="auth-submit-btn" 
            class="w-full bg-[#ff5500] hover:bg-[#ff661a] text-black font-condensed text-base font-black uppercase tracking-wider py-2.5 rounded-xl shadow-lg shadow-[#ff5500]/20 transition cursor-pointer mt-1"
          >
            Se connecter
          </button>
        </form>

        <div class="mt-3.5 text-center text-xs text-slate-400 pt-3 border-t border-[#1b1e28]">
          <span id="auth-switch-text">Pas encore de compte ?</span>
          <button id="auth-switch-btn" class="text-[#ff5500] font-bold ml-1 hover:underline cursor-pointer">
            Créer un compte
          </button>
        </div>

      </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-16 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full text-xs font-bold text-white shadow-2xl transition-all duration-200 opacity-0 pointer-events-none z-50"></div>

  </div>

  <!-- Scripts -->
  <script src="/static/js/api.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
