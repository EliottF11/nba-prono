<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Pick 'n' Swipe</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121214] text-white p-8">

  <div class="max-w-2xl mx-auto bg-[#18181e] p-6 rounded-xl border border-zinc-700">
    <h1 class="text-3xl font-black mb-6 text-[#ffcc00]">Administration - Pronos Flash</h1>
    
    <div id="message" class="mb-4 hidden p-4 rounded-lg"></div>

    <form id="flash-bet-form" class="flex flex-col gap-4">
      
      <!-- Password input removed -->
      <div class="mb-2">
        <p class="text-sm text-zinc-400">Connecte-toi d'abord sur l'app classique avec ton compte <strong>AkiraH444</strong>.</p>
      </div>

      <hr class="border-zinc-700 my-2">

      <div>
        <label class="block text-sm text-zinc-400 mb-1">Équipe du joueur</label>
        <select id="team_id" class="w-full p-2 bg-zinc-900 border border-zinc-700 rounded-lg text-white" required onchange="loadTeamData(this.value)">
          <option value="">Chargement des équipes...</option>
        </select>
      </div>

      <div>
        <label class="block text-sm text-zinc-400 mb-1">Joueur</label>
        <select id="player_name" class="w-full p-2 bg-zinc-900 border border-zinc-700 rounded-lg text-white" required>
          <option value="">Sélectionner d'abord une équipe</option>
        </select>
      </div>

      <div>
        <label class="block text-sm text-zinc-400 mb-1">Match concerné</label>
        <select id="match_select" class="w-full p-2 bg-zinc-900 border border-zinc-700 rounded-lg text-white" required>
          <option value="">Sélectionner d'abord une équipe</option>
        </select>
      </div>

      <div>
        <label class="block text-sm text-zinc-400 mb-1">Type de statistique</label>
        <select id="stat_type" class="w-full p-2 bg-zinc-900 border border-zinc-700 rounded-lg text-white" required>
          <option value="Points">Points</option>
          <option value="Passes">Passes Décisives</option>
          <option value="Rebonds">Rebonds</option>
          <option value="Points + Passes">Points + Passes</option>
          <option value="Points + Rebonds">Points + Rebonds</option>
          <option value="Passes + Rebonds">Passes + Rebonds</option>
          <option value="Points + Passes + Rebonds">Points + Passes + Rebonds</option>
          <option value="3 Points Marqués">3 Points Marqués</option>
          <option value="Interceptions">Interceptions</option>
          <option value="Contres">Contres</option>
        </select>
      </div>

      <div>
        <label class="block text-sm text-zinc-400 mb-1">Seuil / Ligne (ex: 25.5)</label>
        <input type="number" step="0.5" id="threshold" class="w-full p-2 bg-zinc-900 border border-zinc-700 rounded-lg text-white" required>
      </div>

      <div class="flex gap-4">
        <div class="flex-1">
          <label class="block text-sm text-zinc-400 mb-1">Cote PLUS DE</label>
          <input type="number" step="0.01" id="over_odds" class="w-full p-2 bg-zinc-900 border border-zinc-700 rounded-lg text-white" value="1.85" required>
        </div>
        <div class="flex-1">
          <label class="block text-sm text-zinc-400 mb-1">Cote MOINS DE</label>
          <input type="number" step="0.01" id="under_odds" class="w-full p-2 bg-zinc-900 border border-zinc-700 rounded-lg text-white" value="1.85" required>
        </div>
      </div>

      <button type="submit" class="mt-4 bg-[#ffcc00] text-black font-black py-3 rounded-lg hover:bg-yellow-500 transition-colors">
        CRÉER LE PRONO FLASH
      </button>

      <hr class="border-zinc-700 my-4">

      <button type="button" id="btn-sync-players" class="bg-zinc-800 text-white py-2 rounded-lg hover:bg-zinc-700 transition-colors text-sm font-medium flex items-center justify-center gap-2">
        Mettre à jour les effectifs (API)
      </button>

    </form>
  </div>

  <script>
    async function loadTeamData(teamId) {
      if (!teamId) {
        document.getElementById('player_name').innerHTML = '<option value="">Sélectionner d\\'abord une équipe</option>';
        document.getElementById('match_select').innerHTML = '<option value="">Sélectionner d\\'abord une équipe</option>';
        return;
      }
      
      const playerSelect = document.getElementById('player_name');
      const matchSelect = document.getElementById('match_select');
      
      playerSelect.innerHTML = '<option value="">Chargement...</option>';
      matchSelect.innerHTML = '<option value="">Chargement...</option>';
      
      try {
        const [resPlayers, resMatches] = await Promise.all([
          fetch(`/api/teams/${teamId}/players`),
          fetch(`/api/teams/${teamId}/matches`)
        ]);
        
        const players = await resPlayers.json();
        const matches = await resMatches.json();
        
        playerSelect.innerHTML = '';
        players.sort((a,b) => a.name.localeCompare(b.name)).forEach(p => {
          playerSelect.innerHTML += `<option value="${p.name}">${p.name}</option>`;
        });
        
        matchSelect.innerHTML = '';
        if (matches.length === 0) {
          matchSelect.innerHTML = '<option value="">Aucun match prévu pour cette équipe</option>';
        } else {
          matches.forEach(m => {
            matchSelect.innerHTML += `<option value="${m.deadline}">${m.desc}</option>`;
          });
        }
      } catch (e) {
        console.error("Erreur chargement données équipe", e);
      }
    }
    // Charger les équipes
    async function loadTeams() {
      try {
        const res = await fetch('/api/teams');
        const teams = await res.json();
        const select = document.getElementById('team_id');
        select.innerHTML = '<option value="">Sélectionner une équipe...</option>';
        // Trier par code avec fallback si null
        teams.sort((a,b) => (a.code || "").localeCompare(b.code || "")).forEach(t => {
          select.innerHTML += `<option value="${t.id}">${t.city || "Ville Inconnue"} (${t.code || "N/A"})</option>`;
        });
      } catch (e) {
        console.error("Erreur chargement équipes", e);
      }
    }
    loadTeams();

    document.getElementById('flash-bet-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('message');
      msg.className = "mb-4 hidden p-4 rounded-lg";
      
      const token = localStorage.getItem('token');
      if (!token) {
        msg.innerHTML = "Tu dois être connecté sur l'app normale !";
        msg.classList.remove('hidden');
        msg.classList.add('bg-red-900', 'text-red-200');
        return;
      }

      // Convert datetime-local to ISO UTC
      const matchDeadline = document.getElementById('match_select').value;
      if (!matchDeadline) {
        msg.innerHTML = "Veuillez sélectionner un match !";
        msg.classList.remove('hidden');
        msg.classList.add('bg-red-900', 'text-red-200');
        return;
      }

      const payload = {
        player_name: document.getElementById('player_name').value,
        team_id: parseInt(document.getElementById('team_id').value),
        stat_type: document.getElementById('stat_type').value,
        threshold: parseFloat(document.getElementById('threshold').value),
        over_odds: parseFloat(document.getElementById('over_odds').value),
        under_odds: parseFloat(document.getElementById('under_odds').value),
        deadline: matchDeadline
      };

      try {
        const response = await fetch('/api/flash-bets', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          msg.innerHTML = "Prono Flash créé avec succès !";
          msg.classList.remove('hidden');
          msg.classList.add('bg-green-900', 'text-green-200');
          document.getElementById('flash-bet-form').reset();
        } else {
          const err = await response.json();
          msg.innerHTML = "Erreur : " + JSON.stringify(err);
          msg.classList.remove('hidden');
          msg.classList.add('bg-red-900', 'text-red-200');
        }
      } catch (err) {
        msg.innerHTML = "Erreur réseau.";
        msg.classList.remove('hidden');
        msg.classList.add('bg-red-900', 'text-red-200');
      }
    });
    document.getElementById('btn-sync-players').addEventListener('click', async () => {
      const token = localStorage.getItem('token');
      const msg = document.getElementById('message');
      if (!token) return alert("Tu dois être connecté !");

      const btn = document.getElementById('btn-sync-players');
      btn.innerText = "Synchronisation en cours... (~15s)";
      btn.disabled = true;

      try {
        const response = await fetch('/api/sync-players', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (response.ok) {
          const res = await response.json();
          msg.innerHTML = `Synchro terminée : ${res.added} ajoutés, ${res.updated} mis à jour.`;
          msg.className = "mb-4 p-4 rounded-lg bg-green-900 text-green-200";
        } else {
          msg.innerHTML = "Erreur de droits ou API.";
          msg.className = "mb-4 p-4 rounded-lg bg-red-900 text-red-200";
        }
      } catch (e) {
        msg.innerHTML = "Erreur réseau.";
        msg.className = "mb-4 p-4 rounded-lg bg-red-900 text-red-200";
      }
      btn.innerText = "Mettre à jour les effectifs (API)";
      btn.disabled = false;
    });

  </script>
</body>
</html>
