<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="60%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  
  <!-- Fond sombre arrondi OLED -->
  <rect width="512" height="512" rx="115" fill="#000000"/>
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>
  
  <!-- Ballon de basket monochrome -->
  <g filter="url(#shadow)">
    <!-- Sphère graphite/carbone -->
    <circle cx="256" cy="256" r="158" fill="url(#bgGlow)" stroke="#ffffff" stroke-width="4"/>
    
    <!-- Lignes de basket épurées blanches -->
    <!-- Ligne médiane verticale -->
    <path d="M 256,98 L 256,414" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Ligne médiane horizontale -->
    <path d="M 98,256 L 414,256" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Courbe gauche -->
    <path d="M 144,144 C 224,180 224,332 144,368" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Courbe droite -->
    <path d="M 368,144 C 288,180 288,332 368,368" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  </g>
  
  <!-- Reflet lumineux minimaliste -->
  <ellipse cx="205" cy="175" rx="42" ry="20" transform="rotate(-30 205 175)" fill="#ffffff" opacity="0.15"/>
</svg>
