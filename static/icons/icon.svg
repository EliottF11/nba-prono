<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#ff7733"/>
      <stop offset="100%" stop-color="#cc3700"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Fond sombre arrondi -->
  <rect width="512" height="512" rx="115" fill="#0d0f15"/>
  
  <!-- Ballon de basket -->
  <g filter="url(#shadow)">
    <!-- Sphère orange basket -->
    <circle cx="256" cy="256" r="160" fill="url(#bgGlow)"/>
    
    <!-- Lignes de basket noires stylisées -->
    <!-- Ligne médiane verticale -->
    <path d="M 256,96 L 256,416" stroke="#11131a" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Ligne médiane horizontale -->
    <path d="M 96,256 L 416,256" stroke="#11131a" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Courbe gauche -->
    <path d="M 142,142 C 220,180 220,332 142,370" fill="none" stroke="#11131a" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Courbe droite -->
    <path d="M 370,142 C 292,180 292,332 370,370" fill="none" stroke="#11131a" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Contour du ballon -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="#11131a" stroke-width="10"/>
  </g>
  
  <!-- Reflet lumineux -->
  <ellipse cx="205" cy="180" rx="35" ry="18" transform="rotate(-30 205 180)" fill="#ffffff" opacity="0.18"/>
</svg>
